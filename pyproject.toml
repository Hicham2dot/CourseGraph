[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coursegraph"
version = "0.1.0"
description = "Assistant de révision RAG ancré sur les supports de cours et les annales"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    # Vector store
    "qdrant-client>=1.12.0",
    # LLM / orchestration
    "groq>=0.11.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    # Embeddings / reranker (CPU)
    "sentence-transformers>=3.2.0",
    # PDF parsing
    "pymupdf>=1.24.0",
    # NLI verifier
    "transformers>=4.45.0",
    "torch>=2.4.0",
    # Database
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20.0",
    # Export
    "genanki>=0.13.0",
    # Front
    "streamlit>=1.39.0",
    # Evaluation
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "types-PyYAML>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coursegraph"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "RUF",      # ruff-specific
]
ignore = ["E501"]  # line length géré par formatter

[tool.ruff.lint.isort]
known-first-party = ["coursegraph"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/coursegraph"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
